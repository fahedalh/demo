# Each app is served on its own port; /api and /socket.io are proxied to the API so the
# browser sees a single origin per app (httpOnly refresh cookies, no CORS needed).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream masar_api { server api:4000; keepalive 32; }

# Shared settings are repeated per server block (nginx has no server-level include of locations here).
server {
  listen 8080;
  root /usr/share/nginx/passenger;
  include /etc/nginx/conf.d/masar-common.inc;
}
server {
  listen 8081;
  root /usr/share/nginx/driver;
  include /etc/nginx/conf.d/masar-common.inc;
}
server {
  listen 8082;
  root /usr/share/nginx/admin;
  include /etc/nginx/conf.d/masar-common.inc;
}
