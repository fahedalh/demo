openapi: 3.1.0
info:
  title: Bookly API
  version: 0.1.0
  description: |
    Multi-tenant appointment booking API. Errors use `{ error: { code, message, details } }`.
    Validation errors return 422 with `details.fields`. Plan limits return 402 `PLAN_LIMIT`.
servers:
  - url: /api
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Register:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        phone: { type: string }
        locale: { type: string, enum: [en, ar] }
        accountType: { type: string, enum: [customer, business] }
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    CreateBooking:
      type: object
      required: [service, start, customer]
      properties:
        service: { type: string }
        start: { type: string, format: date-time }
        staff: { type: string }
        branch: { type: string }
        attendees: { type: integer }
        mode: { type: string, enum: [in_person, online] }
        customer:
          type: object
          properties: { name: { type: string }, email: { type: string }, phone: { type: string } }
        answers: { type: object, additionalProperties: true }
        note: { type: string }
        paymentMethod: { type: string, enum: [online, cash] }
        recurrence:
          type: object
          properties: { frequency: { type: string, enum: [weekly, biweekly, monthly] }, count: { type: integer, maximum: 12 } }
    Error:
      type: object
      properties:
        error:
          type: object
          properties: { code: { type: string }, message: { type: string }, details: { type: object } }
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: "Register (accountType customer|business); sets refresh cookie"
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Register' } } } }
      responses:
        '200': { description: OK }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/login:
    post:
      tags: [Auth]
      summary: "Log in; returns access token + profile"
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Login' } } } }
      responses:
        '200': { description: OK }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: "Rotate refresh token (cookie) and get a new access token"
      responses:
        '200': { description: OK }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/logout:
    post:
      tags: [Auth]
      summary: "Revoke current refresh token"
      responses:
        '200': { description: OK }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: "Revoke all sessions"
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/me:
    get:
